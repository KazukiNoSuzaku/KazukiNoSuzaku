# Draws a pixel-art red Chinese dragon from public GitHub activity
# (scripts/dragon.py) and commits dragon/dragon.gif.
name: Dragon

on:
  schedule:
    # Shortly after the koi, so it shows the day that just ended.
    - cron: "35 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/dragon.yml, scripts/dragon.py]

permissions:
  contents: write

# Shares the koi's group so the two never push at the same moment.
concurrency: koi

jobs:
  dragon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pillow==11.*
      - name: Draw the dragon
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dragon.py "${{ github.repository_owner }}" --output dragon/dragon.gif
      - name: Commit the dragon if it changed
        shell: bash
        run: |
          git add dragon/dragon.gif
          if git diff --cached --quiet; then
            echo "The dragon is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "dragon: draw the day's dragon"
          git pull --quiet --rebase
          git push --quiet
